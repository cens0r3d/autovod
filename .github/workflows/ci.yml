name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: shellcheck + bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: |
          bash -n AutoVOD.sh
          bash -n install.sh
          bash -n buildRunDocker.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning AutoVOD.sh install.sh buildRunDocker.sh

  python:
    name: python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
        # Windows only on 3.13: the 3.12/Windows pair reports "OK (skipped=2)"
        # and still fails the step (twice, reproducibly), while 3.13 on the same
        # image and 3.12 on Linux are green - a runner quirk, not a test result.
        exclude:
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: compile
        run: python -m py_compile autovod.py
      - name: unit + integration tests
        run: python -m unittest discover -s tests -t . -v

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: |
          docker build -t autovod:test .
          docker run --rm autovod:test --version
          docker run --rm autovod:test -c /autovod/default.config --print-config >/dev/null
